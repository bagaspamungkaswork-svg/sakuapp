/* ===== Popup Catat Transaksi: minimalis, sudut tegas (tidak membulat) ===== */
.backdrop { background: rgba(14, 22, 36, .5); backdrop-filter: none; -webkit-backdrop-filter: none; }
.sheet { border-radius: 10px 10px 0 0; box-shadow: 0 -1px 0 var(--line), 0 24px 60px -24px rgba(10, 25, 60, .55); border: 1px solid var(--line); border-bottom: 0; }
@media (min-width: 700px) { .sheet { border-radius: 10px; border-bottom: 1px solid var(--line); } }
.sheet::before { width: 32px; height: 3px; border-radius: 0; background: var(--line-2); margin-top: 8px; }
.sheet-h { padding: 12px 20px 10px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.sheet-h .icon-btn { border-radius: 6px; width: 34px; height: 34px; background: transparent; box-shadow: none; }
.sheet-h .icon-btn:hover { background: var(--sunken); }
.sheet-b { gap: 16px; padding: 16px 20px 20px; }
.sheet .field > label, .sheet .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.sheet .input, .sheet select.input { border-radius: 6px; min-height: 44px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: none; }
.sheet .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); outline: 0; }
.sheet .amt-wrap { border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 2px 14px; }
.sheet .amt-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.sheet .amt-wrap input { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.sheet .tgl { border-radius: 6px; padding: 3px; gap: 3px; background: var(--sunken); border: 1px solid var(--line); }
.sheet .tgl button { border-radius: 4px; min-height: 42px; font-weight: 600; }
.sheet .tgl button[aria-pressed="true"].out, .sheet .tgl button[aria-pressed="true"].in { box-shadow: none; }
.sheet .cats { border-radius: 6px; background: var(--surface); border: 1px solid var(--line); padding: 10px; gap: 10px; }
.sheet .cat { border-radius: 6px; min-height: 38px; padding: 0 10px 0 6px; border: 1px solid var(--line-2); background: var(--surface); box-shadow: none; font-weight: 600; }
.sheet .cat .chip { border-radius: 4px; width: 26px; height: 26px; }
.sheet .cat[aria-pressed="true"], .sheet .cat[aria-checked="true"], .sheet .cat.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.sheet .cat-new { border-radius: 6px; }
.sheet .buy { border-top: 1px solid var(--line); border-top-style: solid; }
.sheet .btn, .sheet .btn-primary, .sheet .btn-ghost { border-radius: 6px; }
.sheet .btn-primary { box-shadow: none; background: var(--accent); color: var(--accent-ink); }
.sheet .btn-primary:hover { box-shadow: none; transform: none; filter: brightness(1.06); }
.sheet .btn-primary:active { box-shadow: none; transform: none; }
.sheet-f { gap: 8px; border-top: 1px solid var(--line); }
.sheet .item, .sheet .photo-row label { border-radius: 6px; }
.sheet .cat-find .input { border-radius: 6px; }

/* ===== Tombol Catat transaksi: ikon + saja, kotak dengan sudut membulat tipis ===== */
.fab, .fab:hover, .fab:active { width: 54px; height: 54px; padding: 0; border-radius: 10px; display: grid; place-items: center; background: var(--accent); border: 0; box-shadow: 0 6px 16px -6px rgba(29, 75, 181, .7), inset 0 0 0 1px rgba(255, 255, 255, .22); }
.fab:hover { transform: translateY(-2px); filter: brightness(1.07); }
.fab:active { transform: scale(.95); }
.fab-t { display: none !important; }
@media (min-width: 900px) { .fab, .fab:hover, .fab:active { width: 54px; height: 54px; padding: 0; border-radius: 10px; } }
.lbl-note { font-weight: 600; color: var(--ink-3); letter-spacing: 0; text-transform: none; }

/* ===== Tur menu ===== */
.tour { position: fixed; inset: 0; z-index: 90; }
.tour-hl { position: fixed; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(10, 20, 40, .62), 0 0 0 3px var(--accent) inset; pointer-events: none; transition: all .25s var(--ease); }
.tour-card { position: fixed; max-width: 340px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: 0 20px 50px -18px rgba(10, 25, 60, .6); display: grid; gap: 6px; }
.tour-card small { color: var(--ink-3); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.tour-card h3 { margin: 0; font-size: 17px; font-weight: 800; }
.tour-card p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.tour-act { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
@media (min-width: 900px) { .tour-card { width: 320px; } }

/* ===== Pengaturan Profil ===== */
.pp-photo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.avatar.pp-av { width: 72px; height: 72px; font-size: 24px; flex: none; border-radius: 10px; }
.pp-ph-r { display: grid; gap: 6px; min-width: 0; }
.pp-row { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.pp-row .field { flex: 1 1 200px; min-width: 0; }
#pf-av, .me .avatar, .top-r .avatar { background-size: cover; background-position: center; }

/* ===== Master data akun: daftar ringkas, dipisah Aktif / Nonaktif / Ditolak / Perlu Persetujuan ===== */
.acc-sec { border-top: 1px solid var(--line); }
.acc-sec:first-child { border-top: 0; }
.acc-sec-h { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 2px; text-align: left; font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.acc-sec-h .cnt { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-size: 12px; display: inline-grid; place-items: center; letter-spacing: 0; }
.acc-sec-t { flex: 1; }
.acc-sec-c { transition: transform .25s var(--ease); transform: rotate(-90deg); color: var(--ink-3); display: grid; }
.acc-sec.shut .acc-sec-c { transform: rotate(90deg); }
.acc-sec.shut .acc-sec-b { display: none; }
.acc { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; }
.acc .avatar { width: 34px; height: 34px; font-size: 12px; border-radius: 8px; }
.acc .who b { font-size: 14px; display: inline; }
.acc .who small { display: inline; font-size: 11.5px; margin-left: 6px; }
.acc .who small.meta { display: block; margin: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc .badges { display: inline-flex; margin: 0 0 0 6px; gap: 4px; vertical-align: middle; }
.acc .badges .badge { font-size: 10.5px; padding: 1px 7px; }
.acc .acts { grid-column: 3; grid-row: 1 / span 2; margin: 0; gap: 4px; justify-content: flex-end; align-self: center; }
.acc .acts .btn { min-height: 28px; padding: 0 9px; font-size: 11.5px; border-radius: 6px; }
@media (max-width: 720px) { .acc .acts { grid-column: 2; grid-row: auto; justify-content: flex-start; margin-top: 4px; } }
.reg { gap: 6px; padding: 8px 0; }
.reg-h .avatar { width: 34px; height: 34px; font-size: 12px; border-radius: 8px; }
.reg-d { background: transparent; padding: 0; gap: 2px 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.reg-d dt { display: inline; font-size: 11px; } .reg-d dt::after { content: ": "; }
.reg-d dd { display: inline; margin: 0; font-size: 12.5px; }
.reg .acts .btn { min-height: 30px; padding: 0 11px; font-size: 12px; border-radius: 6px; }

/* ===== Jarak antar blok halaman: kartu ringkasan, filter, dan kartu di bawahnya tidak boleh mepet ===== */
#view > .tiles, #view > .cic-sum { margin-bottom: 16px; }
#view > .hut-fil, #view > .seg { margin-bottom: 16px; }
#view > .card, #view > section.card, #view > .hero { margin-bottom: 16px; }
#view > .card:last-child, #view > .stack { margin-bottom: 0; }
#view > .sec-t { margin-top: 24px; }
#view > .banner { margin-bottom: 16px; }

/* revisi: submenu tanpa titik & garis; sudut popup/FAB sewajarnya */
.nav-sub-in { margin-left: 14px; padding-left: 0; }
.nav-sub-in::before, .nav-mk { display: none !important; }
.nav-s { padding: 0 12px 0 18px; }
.sheet { border-radius: 18px 18px 0 0; }
@media (min-width: 700px) { .sheet { border-radius: 18px; } }
.sheet .input, .sheet select.input, .sheet .amt-wrap, .sheet .tgl, .sheet .cats, .sheet .cat-new, .sheet .btn, .sheet .btn-primary, .sheet .btn-ghost, .sheet .item, .sheet .photo-row label, .sheet .cat-find .input { border-radius: 12px; }
.sheet .cat { border-radius: 10px; }
.sheet .tgl button { border-radius: 9px; }
.sheet .cat .chip { border-radius: 8px; }
.sheet-h .icon-btn { border-radius: 10px; }
.fab, .fab:hover, .fab:active { border-radius: 16px; }
@media (min-width: 900px) { .fab, .fab:hover, .fab:active { border-radius: 16px; } }

/* Navigasi bawah ringkas (opsi C): 3 tab + tombol + di tengah + Lainnya */
@media (max-width: 899px) {
  .main { padding-bottom: 120px; }
  .tabbar { border-radius: 20px; padding: 6px 6px 8px; }
  .tab-gap { flex: 1; min-width: 0; }
  .fab, .fab:hover, .fab:active { left: 0; right: 0; margin-inline: auto; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; border-radius: 16px; z-index: 41; animation: none; }
  .fab:active { transform: scale(.94); }
  body.more-open .fab { display: none; }
  .more-scrim { position: fixed; inset: 0; z-index: 44; background: rgba(3, 8, 16, .5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .more-sh { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; max-width: 520px; margin-inline: auto; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 14px 14px calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .25s var(--ease); box-shadow: var(--shadow-2); }
  body.more-open .more-scrim { opacity: 1; pointer-events: auto; }
  body.more-open .more-sh { transform: none; }
  .more-h { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  .more-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .more-i { display: grid; justify-items: center; gap: 4px; padding: 10px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunken); color: var(--ink-3); font-size: 11px; font-weight: 600; min-width: 0; }
  .more-i > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-i .pill { position: relative; display: grid; place-items: center; }
  .more-i[aria-current="page"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
}
@media (min-width: 900px) { .more-scrim, .more-sh { display: none; } }
@media (prefers-reduced-motion: reduce) { .more-sh, .more-scrim { transition: none; } }

/* ===== Perjalanan, Wishlist, Teman ===== */
:root { --tr-grid: #CFDBEA; --tr-land: #E7EEF7; --tr-water: #D5E6F7; --tr-c1: #2F6BED; --tr-c2: #12A28A; --tr-c3: #E39A0B; --tr-c4: #8B5CF6; --tr-c5: #64748B; --tr-bbm: #E5484D; --tr-mkn: #E39A0B; --tr-rst: #12A28A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tr-grid: #223246; --tr-land: #1B2735; --tr-water: #12273D; --tr-c1: #6D9BFF; --tr-c2: #3CC9AF; --tr-c3: #F2B544; --tr-c4: #A98BFF; --tr-c5: #94A3B8; --tr-bbm: #FF7B80; --tr-mkn: #F2B544; --tr-rst: #3CC9AF; } }
:root[data-theme="dark"] { --tr-grid: #223246; --tr-land: #1B2735; --tr-water: #12273D; --tr-c1: #6D9BFF; --tr-c2: #3CC9AF; --tr-c3: #F2B544; --tr-c4: #A98BFF; --tr-c5: #94A3B8; --tr-bbm: #FF7B80; --tr-mkn: #F2B544; --tr-rst: #3CC9AF; }
.tr-b1 { background: var(--tr-c1); } .tr-b2 { background: var(--tr-c2); } .tr-b3 { background: var(--tr-c3); } .tr-b4 { background: var(--tr-c4); } .tr-b5 { background: var(--tr-c5); }
.tr-dbbm { background: var(--tr-bbm); } .tr-dmkn { background: var(--tr-mkn); } .tr-drst { background: var(--tr-rst); }
.tr-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 5px; background: var(--sunken); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
.tr-modes button { display: grid; justify-items: center; gap: 4px; min-height: 56px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-3); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.tr-modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tr-cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .tr-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.tr-col { display: grid; gap: 16px; min-width: 0; align-content: start; }
.tr-sr { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); margin-bottom: 10px; display: grid; gap: 10px; }
.tr-sh { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.tr-sico { color: var(--accent); display: grid; place-items: center; }
.tr-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.tr-chips button { display: grid; justify-items: center; gap: 3px; padding: 10px 2px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--ink-3); font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; }
.tr-chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.tr-step { display: flex; align-items: center; gap: 10px; } .tr-step output { min-width: 28px; text-align: center; font-size: 18px; font-weight: 800; }
.tr-rg { display: flex; align-items: center; gap: 12px; } .tr-rg input { flex: 1; accent-color: var(--accent); } .tr-rg output { min-width: 64px; text-align: right; font-weight: 800; }
.tr-hero { background: linear-gradient(150deg, #2F6BED, #1B45B4); color: #fff; border: 0; }
.tr-hero small { opacity: .82; font-size: 12px; display: block; }
.tr-big { font-size: 32px; font-weight: 800; letter-spacing: -.025em; margin: 2px 0; }
.tr-pp { font-size: 13px; opacity: .92; }
.tr-kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.tr-kpi div { background: rgba(255, 255, 255, .14); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.tr-kpi small { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.tr-kpi b { display: block; font-size: 14.5px; margin-top: 2px; overflow-wrap: anywhere; }
.tr-bar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin: 2px 0 12px; background: var(--sunken); }
.tr-bar i { display: block; min-width: 3px; }
.tr-bl > div { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tr-bl > div:last-child { border: 0; }
.tr-bl > div > span { display: flex; align-items: center; gap: 8px; min-width: 0; } .tr-bl i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tr-bl small { display: block; color: var(--ink-3); font-size: 11.5px; font-weight: 500; }
.tr-map { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.tr-svg { display: block; width: 100%; height: auto; }
.tr-embed { display: block; width: 100%; height: 300px; border: 1px solid var(--line); border-radius: 12px; }
.tr-cap { position: absolute; left: 10px; bottom: 8px; font-size: 10.5px; color: var(--ink-3); } .tr-cap span { background: var(--surface); padding: 2px 7px; border-radius: 6px; opacity: .9; }
.tr-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0; font-size: 12px; color: var(--ink-3); } .tr-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.tr-key { margin-top: 12px; }
.tr-pt { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: start; position: relative; }
.tr-pt::before { content: ""; position: absolute; left: 15px; top: 32px; bottom: -2px; width: 2px; background: var(--line-2); }
.tr-pt:last-child::before { display: none; }
.tr-chip { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: #fff; z-index: 1; }
.tr-tx { padding-bottom: 16px; min-width: 0; } .tr-tx b { font-size: 14.5px; display: block; } .tr-tx small { display: block; color: var(--ink-3); font-size: 12px; line-height: 1.4; margin-top: 2px; }
.tr-rt { text-align: right; padding-bottom: 16px; font-size: 13px; font-weight: 800; white-space: nowrap; } .tr-rt small { display: block; color: var(--ink-3); font-weight: 600; font-size: 11.5px; }
.tr-pt.off .tr-tx, .tr-pt.off .tr-rt { opacity: .45; } .tr-pt.off .tr-tx b { text-decoration: line-through; }
.tr-sw { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); cursor: pointer; } .tr-sw input { accent-color: var(--accent); width: 16px; height: 16px; }
.tr-seg { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
.tr-seg b { color: var(--ink); } .tr-seg .ic { color: var(--accent); flex: none; }
.tr-start { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }
.tr-st { display: grid; justify-items: center; gap: 8px; padding: 16px 8px; cursor: pointer; font: inherit; color: var(--ink); }
.ws-alt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 4px 0 8px; }
.ws-alt span { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 11px; color: var(--ink-3); }
.ws-alt b { display: block; color: var(--ink); font-size: 12.5px; margin-top: 2px; }
/* Teman: infografis animasi */
.tm-badge { align-self: start; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 800; white-space: nowrap; }
.tm-stage { position: relative; height: 230px; border-radius: 14px; background: linear-gradient(180deg, var(--accent-soft), var(--sunken)); border: 1px solid var(--line); overflow: hidden; }
.tm-ph { position: absolute; top: 34px; width: 92px; height: 150px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line-2); display: grid; align-content: center; justify-items: center; gap: 8px; box-shadow: 0 14px 26px -16px rgba(10, 25, 60, .5); }
.tm-a { left: 8%; } .tm-b { right: 8%; }
.tm-ph small { font-size: 11px; font-weight: 800; color: var(--ink-3); }
.tm-av { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.tm-av2 { background: var(--tr-c2); color: #fff; }
.tm-ok { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--tr-c2); color: #fff; display: grid; place-items: center; opacity: 0; transform: scale(0); }
.tm-code { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); padding: 8px 12px; border-radius: 10px; background: var(--ink); color: var(--bg, #fff); font: 800 14px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; opacity: 0; white-space: nowrap; }
.tm-link { position: absolute; left: calc(8% + 92px); right: calc(8% + 92px); top: 108px; height: 4px; opacity: 0; } .tm-link i { display: block; height: 100%; border-radius: 4px; background: var(--tr-c2); transform-origin: left; transform: scaleX(0); }
.tm-cards { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); display: grid; gap: 8px; width: 40%; min-width: 128px; }
.tm-cards span { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); font-size: 12px; font-weight: 700; opacity: 0; transform: translateY(14px) scale(.9); box-shadow: 0 8px 16px -10px rgba(10, 25, 60, .5); }
.tm-cards .ic { color: var(--accent); }
.tm-stage[data-s="1"] .tm-code { animation: tm-type 1.8s steps(10) .2s forwards; }
.tm-stage[data-s="1"] .tm-a { animation: tm-pulse 1.2s ease .2s 2; }
.tm-stage[data-s="2"] .tm-code { left: 18%; transform: none; animation: tm-fly 2.2s cubic-bezier(.5, 0, .2, 1) .2s forwards; }
.tm-stage[data-s="2"] .tm-b { animation: tm-pulse 1s ease 2.2s 2; }
.tm-stage[data-s="3"] .tm-link { opacity: 1; } .tm-stage[data-s="3"] .tm-link i { animation: tm-draw 1.4s ease .2s forwards; }

   tetapi DI BAWAH kartu "Versi baru tersedia" (.upd, 120) supaya kartu itu tidak tertutup. Semua warna dari token tema. */

.ld-skip:hover { background: var(--sunken); color: var(--ink); }
.ld.last .ld-skip { visibility: hidden; }

/* jalur geser (scroll-snap horizontal) */
.ld-track { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.ld-track::-webkit-scrollbar { display: none; }
.ld-slide { flex: 0 0 100%; min-width: 0; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; justify-content: center; justify-content: safe center; gap: 18px; padding: 6px 20px 4px; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none; }
.ld-slide::-webkit-scrollbar { display: none; }

/* panggung ilustrasi */

.ld-art::before { content: ""; position: absolute; right: -46px; top: -56px; width: 168px; height: 168px; border-radius: 50%; background: color-mix(in srgb, var(--surface) 62%, transparent); }
.ld-art::after { content: ""; position: absolute; left: 16px; bottom: 16px; width: 14px; height: 14px; border-radius: 50%; background: #FFC83D; box-shadow: 30px -9px 0 -3px color-mix(in srgb, var(--in-bar) 80%, transparent); }

/* ---- warna bagian ilustrasi (token tema) ---- */

.sv-ln { fill: var(--line); } .sv-ln2 { fill: var(--line-2); }

  .ld-p { margin: 20px 0 0; max-width: 30em; min-height: 0; font-size: clamp(17px, 1.5vw, 22px); line-height: 1.55; text-align: left; }

/* ---- gerak (hanya bila pengguna tidak meminta gerak dikurangi) ---- */
@media (prefers-reduced-motion: no-preference) {

  @keyframes ld-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes ld-show { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ld-pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: none; } }
  @keyframes ld-growx { from { opacity: 1; transform: scaleX(0); } to { opacity: 1; transform: none; } }
  @keyframes ld-growy { from { opacity: 1; transform: scaleY(0); } to { opacity: 1; transform: none; } }
  @keyframes ld-in { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  @keyframes ld-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes ld-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes ld-ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes ld-wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @keyframes ld-blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  .ld-a { opacity: 0; }
  .ld-a.ld-draw { opacity: 1; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  .ld-slide.on .ld-a { animation-duration: .62s; animation-timing-function: cubic-bezier(.2, .9, .3, 1.1); animation-fill-mode: both; animation-delay: calc(var(--d, 0) * 110ms + 140ms); }
  .ld-slide.on .ld-rise { animation-name: ld-rise; }

  .ld-slide.on .ld-show { animation-name: ld-show; animation-delay: calc(var(--d, 0) * 110ms + 500ms); animation-duration: .9s; }
  .ld-slide.on .ld-pop { animation-name: ld-pop; animation-timing-function: cubic-bezier(.3, 1.5, .5, 1); }
  .ld-slide.on .ld-growx { animation-name: ld-growx; transform-origin: left center; animation-timing-function: cubic-bezier(.2, .8, .2, 1); animation-duration: .8s; }
  .ld-slide.on .ld-growy { animation-name: ld-growy; transform-origin: center bottom; animation-timing-function: cubic-bezier(.2, .8, .2, 1); animation-duration: .7s; }
  .ld-slide.on .ld-draw { animation-name: ld-draw; animation-duration: 1.1s; animation-timing-function: ease-out; }
  .ld-slide.on .ld-float { animation: ld-float 3.4s ease-in-out 1.4s infinite; }

  .ld-slide.on .ld-ring.r2 { animation-delay: 1s; }
  .ld-slide.on .ld-wv { transform-origin: center; animation: ld-wave 1s ease-in-out infinite; animation-delay: calc(var(--k, 0) * .13s); }
  .ld-slide.on .ld-eye { transform-origin: center; animation: ld-blink 3.6s ease-in-out 1.2s infinite; }
}

/* gaya Masuk dengan Google / Lupa kata sandi / Reset sandi (auth-ext.js); memakai token warna tema terang dan gelap */

/* ===== Pengantar "Tampilan baru" (sekali setelah masuk) ===== */
@keyframes wn-fade { from { opacity: 0; } }
@keyframes wn-up { from { opacity: 0; transform: translateY(20px); } }
@keyframes wn-pop { from { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.1); } }
@keyframes wn-float { 50% { transform: translateY(-12px) rotate(2deg); } }
@keyframes wn-ring { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(2.1); } }
@keyframes wn-tw { 0%, 100% { opacity: .15; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
@keyframes wn-draw { from { stroke-dashoffset: 100; } }
@keyframes wn-rfill { from { stroke-dasharray: 0 100; } }
@keyframes wn-gx { from { transform: scaleX(0); } }
@keyframes wn-gy { from { transform: scaleY(0); } }
@keyframes wn-in { from { opacity: 0; transform: translateX(36px); } }
