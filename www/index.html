:root { --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.2, .9, .3, 1.15); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "cv11" 1, "ss03" 0;
  -moz-osx-font-smoothing: grayscale;
}
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--glow); pointer-events: none; }
::selection { background: var(--brand-soft); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
code { font-family: var(--f-code); font-size: .92em; background: var(--sunken); padding: 1px 6px; border-radius: 6px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ic { display: block; flex: none; }
.mono { font-family: var(--f-code); }
.muted { color: var(--ink-3); }
.pos { color: var(--in); }
.neg { color: var(--out); }
.grow { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cats, .sheet-b, .tblwrap { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* ---------- gerak ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
#view.enter > * { animation: rise .6s var(--ease) both; }
#view.enter > :nth-child(2) { animation-delay: .05s; }
#view.enter > :nth-child(3) { animation-delay: .1s; }
#view.enter > :nth-child(4) { animation-delay: .15s; }
#view.enter > :nth-child(n+5) { animation-delay: .2s; }
#view.enter .dash > *, #view.enter .col > *, #view.enter .stack > * { animation: rise .65s var(--ease) both; animation-delay: .22s; }
#view.enter .dash > :nth-child(2), #view.enter .col > :nth-child(2), #view.enter .stack > :nth-child(2) { animation-delay: .29s; }
#view.enter .dash > :nth-child(3), #view.enter .col > :nth-child(3), #view.enter .stack > :nth-child(3) { animation-delay: .36s; }
#view.enter .dash > :nth-child(n+4), #view.enter .col > :nth-child(n+4), #view.enter .stack > :nth-child(n+4) { animation-delay: .43s; }
#view.enter .dash.two > .col > *, #view.enter .stack > * { animation-name: rise; }
#view.enter-soft .hero, #view.enter-soft .dash, #view.enter-soft .dl-row { animation: fade .32s ease both; }
#view.enter-soft .range .rl > span { display: inline-block; animation: rise .35s var(--ease) both; }

/* ---------- tombol & input ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 15px; font-weight: 600; font-size: 14.5px; border: 1.5px solid transparent; transition: transform .18s var(--ease), background .2s, box-shadow .2s, filter .2s, border-color .2s; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 20px -10px rgba(245, 176, 39, .95); }
.btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 14px 24px -10px rgba(245, 176, 39, .95); }
.btn-primary:active { transform: scale(.97); }
.btn-ghost { border-color: var(--line-2); background: var(--surface); color: var(--ink); }
.btn-ghost:hover { background: var(--sunken); border-color: var(--ink-3); }
.btn-dark { background: var(--sunken); color: var(--ink); }
.btn-dark:hover { background: var(--line); }
.btn-danger { border-color: color-mix(in srgb, var(--out) 50%, transparent); color: var(--out); background: transparent; }
.btn-danger.armed { background: var(--out); color: var(--on-solid); border-color: var(--out); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-sm { min-height: 40px; padding: 0 15px; font-size: 13px; border-radius: 13px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; border: 0; background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--ring); flex: none; transition: transform .18s var(--ease), background .2s; }
.icon-btn:hover { background: var(--sunken); }
.icon-btn:active { transform: scale(.92); }
.icon-btn[disabled] { opacity: .35; cursor: not-allowed; box-shadow: none; }
.field { display: grid; gap: 7px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }
.input { width: 100%; min-height: 48px; padding: 0 15px; border-radius: 14px; border: 1.5px solid transparent; background: var(--sunken); color: var(--ink); font-size: 16px; min-width: 0; transition: border-color .2s, background .2s, box-shadow .2s; }
.input:hover { border-color: var(--line-2); }
.input:focus, .input:focus-visible { outline: none; background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }
.input::placeholder { color: var(--ink-3); opacity: .8; }
select.input { padding-right: 10px; }
.pw { position: relative; }
.pw .input { padding-right: 48px; }
.pw .eye { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink-3); border-radius: 11px; }
.pw .eye:hover { color: var(--ink); background: var(--line); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.form-err { color: var(--out); background: var(--danger-bg); border-radius: 12px; padding: 10px 13px; font-size: 13.5px; }
.form-ok { color: var(--in); font-size: 13.5px; font-weight: 600; }
.banner { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); border-radius: 18px; padding: 13px 15px; font-size: 13.5px; color: var(--ink); }
.banner .ic { margin-top: 0; }
.banner .btn { margin-left: auto; }

/* ---------- muat & kosong ---------- */
.boot { display: grid; place-items: center; min-height: 60vh; color: var(--ink-3); gap: 12px; text-align: center; padding: 24px; animation: fade .4s both; }
.dot-pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.empty { text-align: center; padding: 30px 14px; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
.empty h3 { font-size: 17px; color: var(--ink); }
.empty p { max-width: 38ch; font-size: 14px; }
.empty .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.empty-s { padding: 14px 0; color: var(--ink-3); font-size: 14px; }
.skel { border-radius: 22px; background: linear-gradient(100deg, var(--sunken) 30%, color-mix(in srgb, var(--sunken) 35%, var(--surface)) 50%, var(--sunken) 70%); background-size: 220% 100%; animation: shimmer 1.5s linear infinite; }
.skel-wrap { display: grid; gap: 16px; animation: fade .4s both; }
.skel-line { height: 30px; width: 46%; border-radius: 12px; }
.skel-hero { height: 250px; border-radius: 30px; }
.skel-card { height: 260px; border-radius: 26px; }
.skel-grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 899px) { .skel-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- login ---------- */
.login { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); max-width: 1080px; margin: 0 auto; padding-block: 20px; min-height: 100dvh; gap: 22px; align-items: stretch; animation: fade .5s both; }
.login-brand { position: relative; overflow: hidden; border-radius: 34px; color: #fff; padding: 40px 40px 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 30px; background: var(--login-bg); box-shadow: var(--shadow-2); isolation: isolate; }
.login-brand::before, .login-brand::after { content: ""; position: absolute; border-radius: 50%; z-index: -1; pointer-events: none; }
.login-brand::before { width: 340px; height: 340px; right: -120px; top: -110px; background: radial-gradient(closest-side, rgba(255, 207, 74, .55), rgba(255, 207, 74, 0)); animation: float 9s ease-in-out infinite; }
.login-brand::after { width: 320px; height: 320px; left: -130px; bottom: -140px; background: radial-gradient(closest-side, rgba(52, 211, 153, .42), rgba(52, 211, 153, 0)); animation: float 11s ease-in-out -4s infinite; }
.login-brand .brand { padding: 0; color: #fff; }
.login-brand h1 { font-size: clamp(2.2rem, 4.6vw, 3.3rem); font-weight: 700; letter-spacing: -.035em; line-height: 1.04; margin-top: 22px; text-wrap: balance; }
.login-brand h1 span { color: #FFD25A; }
.login-brand p { color: rgba(255, 255, 255, .88); max-width: 34ch; margin-top: 14px; font-size: 15.5px; }
.lg-preview { background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .22); border-radius: 24px; padding: 16px 18px 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: grid; gap: 10px; max-width: 330px; }
.lg-preview .k { font-size: 12px; font-weight: 500; letter-spacing: 0; color: rgba(255, 255, 255, .85); display: flex; justify-content: space-between; gap: 8px; }
.lg-preview .v { font-size: 25px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.lg-bars { display: flex; align-items: flex-end; gap: 7px; height: 52px; }
.lg-bars i { flex: 1; border-radius: 7px 7px 4px 4px; background: rgba(255, 255, 255, .5); height: var(--h); animation: rise .8s var(--ease) both; animation-delay: calc(var(--d, 0) * .06s + .3s); }
.lg-bars i.hl { background: #FFD25A; }
.feats { display: grid; gap: 13px; }
.feats li { display: flex; gap: 12px; align-items: center; font-size: 14.5px; font-weight: 600; }
.feats .ic { color: #FFD25A; }
.login-form-wrap { display: grid; align-content: center; padding: 8px 0; }
.login-form-wrap > div { background: var(--surface); border-radius: 32px; padding: 34px clamp(22px, 4vw, 36px) 26px; box-shadow: var(--shadow-2), inset 0 0 0 1px var(--ring); max-width: 460px; width: 100%; margin: 0 auto; animation: pop .6s var(--ease) .1s both; }
.login-form { display: grid; gap: 16px; width: 100%; margin: 0 auto; }
.login-form h2 { font-size: 27px; font-weight: 600; letter-spacing: -.02em; }
.login-form .sub { color: var(--ink-2); margin-top: -8px; font-size: 14.5px; }
.login-note { font-size: 12.5px; color: var(--ink-3); text-align: center; margin: 18px auto 0; }

/* ---------- kerangka aplikasi ---------- */
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -.02em; padding: 2px 8px 14px; }
.logo .lg-bg { fill: var(--accent); }
.logo .lg-ln { stroke: var(--accent-ink); fill: none; }
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 28px; max-width: 1360px; margin: 0 auto; padding-block: 16px; align-items: start; }
.side { position: sticky; top: 16px; height: calc(100dvh - 32px); background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); color: var(--ink); border-radius: 30px; padding: 20px 14px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--ring); }
.side .nav { display: grid; gap: 4px; margin-top: 14px; }
.nav-i { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: 15px; color: var(--ink-2); font-weight: 600; width: 100%; text-align: left; transition: background .2s, color .2s, transform .18s var(--ease), box-shadow .2s; }
.nav-i:hover { background: var(--sunken); color: var(--ink); }
.nav-i:active { transform: scale(.98); }
.nav-i[aria-current="page"] { background: var(--nav-on-bg); color: var(--nav-on-ink); box-shadow: 0 12px 22px -14px rgba(15, 42, 36, .75); }
.nav-i[aria-current="page"] .ic { color: var(--accent); }
.side-foot { margin-top: auto; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.me { display: flex; gap: 10px; align-items: center; min-width: 0; }
.me b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me small { color: var(--ink-3); font-size: 12px; }
.me > div { min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 15px; background: var(--accent-soft); color: var(--ink); display: grid; place-items: center; font-weight: 600; flex: none; }
.avatar.sm { width: 40px; height: 40px; border-radius: 14px; font-size: 13px; background: linear-gradient(140deg, #FFD25A, var(--accent)); color: var(--accent-ink); }
.main { min-width: 0; padding-bottom: 104px; }
.topbar { display: none; align-items: center; justify-content: space-between; padding: 14px 0 4px; }
.topbar .brand { padding: 0; }
.tabbar { display: none; }
@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 0; }
  .side { display: none; }
  .topbar { display: flex; }
  .main { padding-bottom: 188px; }
  .hide-m { display: none !important; }
  .tabbar { display: flex; position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 460px; margin-inline: auto; z-index: 30;
    background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-radius: 30px; padding: 8px 8px;
    justify-content: space-around; align-items: flex-end; box-shadow: var(--shadow-2), inset 0 0 0 1px var(--ring); animation: rise .6s var(--ease) .2s both; }
  .tab { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); flex: 1; min-width: 0; padding: 2px 0; transition: color .2s; }
  .tab .pill { padding: 5px 0; width: 56px; display: grid; place-items: center; border-radius: 999px; transition: background .25s var(--ease), transform .25s var(--ease); }
  .tab:active .pill { transform: scale(.92); }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab[aria-current="page"] .pill { background: var(--brand-soft); color: var(--brand); }
}


/* ---------- tombol + melayang (terpisah dari menu) ---------- */
.fab { position: fixed; z-index: 40; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 22px; background: linear-gradient(145deg, #FFD25A, var(--accent)); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 16px 28px -10px rgba(245, 176, 39, .95), inset 0 0 0 1px rgba(255, 255, 255, .4); transition: transform .22s var(--spring), box-shadow .2s; animation: pop .6s var(--spring) .3s backwards; }
.fab:hover { transform: translateY(-2px); box-shadow: 0 20px 32px -10px rgba(245, 176, 39, .95), inset 0 0 0 1px rgba(255, 255, 255, .4); }
.fab:active { transform: scale(.92) rotate(90deg); }
.fab-t { display: none; font-weight: 600; font-size: 14.5px; letter-spacing: -.005em; }
@media (min-width: 900px) {
  .fab { right: 32px; bottom: 32px; width: auto; height: 56px; padding: 0 24px 0 18px; border-radius: 20px; }
  .fab-t { display: inline; }
  .fab:active { transform: scale(.96); }
}

/* ---------- halaman ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 16px; }
h1 { font-size: clamp(1.6rem, 4vw, 2rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.hello { font-size: 13.5px; font-weight: 600; color: var(--ink-3); margin-bottom: 1px; }
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; gap: 2px; max-width: 100%; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--ring); }
.seg button { min-height: 38px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; transition: background .25s var(--ease), color .25s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--nav-on-bg); color: var(--nav-on-ink); }
.range { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.range .rl { flex: 1; text-align: center; font-weight: 600; font-size: 15.5px; min-width: 0; letter-spacing: -.01em; }
.range .back { display: block; margin: 1px auto 0; font-size: 12.5px; font-weight: 600; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }

.hero { position: relative; overflow: hidden; isolation: isolate; background: var(--hero-bg); color: var(--hero-ink); border-radius: 32px; padding: 26px; display: grid; gap: 18px; box-shadow: var(--shadow-1), inset 0 0 0 1px rgba(255, 255, 255, .45); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; z-index: -1; pointer-events: none; }
.hero::before { width: 360px; height: 360px; right: -110px; top: -170px; background: radial-gradient(closest-side, var(--hero-orb1), transparent); }
.hero::after { width: 300px; height: 300px; left: -100px; bottom: -170px; background: radial-gradient(closest-side, var(--hero-orb2), transparent); }
.hero .eyebrow { font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: var(--hero-ink-2); }
.hero .big { font-size: clamp(2.4rem, 9vw, 3.7rem); font-weight: 700; letter-spacing: -.045em; line-height: 1.05; margin-top: 6px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.hero .big .rp { font-size: .4em; font-weight: 600; margin-right: .42em; color: var(--hero-rp); letter-spacing: 0; vertical-align: .62em; }
.hero-cap { font-size: 12.5px; color: var(--hero-ink-2); font-weight: 600; margin-bottom: -6px; }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hstat { background: var(--hero-pill); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 20px; padding: 13px 15px; min-width: 0; transition: transform .25s var(--ease); }
.hstat:hover { transform: translateY(-2px); }
.hstat .k { font-size: 12px; color: var(--hero-ink-2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.hstat .v { font-family: var(--f-mono); font-weight: 600; font-size: clamp(.9rem, 2.2vw, 1.08rem); margin-top: 4px; overflow-wrap: anywhere; color: var(--hero-ink); }
.hstat .v.neg { color: var(--hero-neg); }
.hstat .v.pos { color: var(--hero-pos); }
@media (max-width: 560px) {
  .hero { padding: 20px; border-radius: 28px; }
  .hero-stats { grid-template-columns: 1fr; gap: 8px; }
  .hstat { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 18px; }
  .hstat .v { margin-top: 0; text-align: right; }
}
.budget { display: grid; gap: 8px; }
.budget .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--hero-ink-2); font-weight: 600; flex-wrap: wrap; }
.budget .row b { color: var(--hero-ink); font-family: var(--f-mono); font-weight: 600; }
.meter { height: 10px; border-radius: 99px; background: var(--hero-track); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--brand); transform-origin: left; animation: meter-in .9s var(--ease) both; }
@keyframes meter-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.meter.over > i { background: var(--hero-neg); }
/* Grafik anggaran: kuning saat mendekati batas (90% sampai 95%), merah di atas 95% atau bila melebihi batas */
.meter.warn > i { background: var(--hero-warn); }
.meter.danger > i, .meter.over > i { background: var(--hero-danger); }

.dash { display: grid; gap: 18px; margin-top: 18px; grid-template-columns: minmax(0, 1fr); }
.dash.two { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.col { display: grid; gap: 18px; align-content: start; min-width: 0; }
.card { background: var(--surface); border-radius: 28px; padding: 22px; min-width: 0; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--ring); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
.card-h .sub { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.delta { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.hero .delta.neg { color: var(--hero-neg); }
.hero .delta.pos { color: var(--hero-pos); }
.lead { background: var(--brand-soft); border-radius: 18px; padding: 12px 15px; font-size: 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
.lead .ic { color: var(--brand); flex: none; }
.lead b { font-weight: 600; }

/* ---------- grafik ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.ax { fill: var(--ink-3); font: 500 10.5px var(--f-mono); }
.ax.sel { fill: var(--ink); font-weight: 600; }
.gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; stroke-linecap: round; }
.bl { stroke: var(--line-2); stroke-width: 1; }
.b-out { fill: var(--out-bar); }
.b-in { fill: var(--in-bar); }
.band { fill: var(--sunken); }
.hit { fill: transparent; cursor: pointer; }
.hit:hover { fill: color-mix(in srgb, var(--brand) 7%, transparent); }
.tip { position: absolute; top: 0; z-index: 5; pointer-events: none; background: var(--deep); color: var(--deep-ink); border-radius: 15px; padding: 10px 13px; font-size: 12px; line-height: 1.5; box-shadow: var(--shadow-2); min-width: 150px; transform: translate(-50%, -100%); margin-top: -6px; animation: fade .15s both; }
.tip b { display: block; font-size: 12.5px; margin-bottom: 3px; }
.tip span { display: flex; justify-content: space-between; gap: 14px; font-family: var(--f-mono); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 12px; font-weight: 600; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend span { display: inline-flex; align-items: center; }
.legend i.dash { display: block; margin-top: 0; width: 16px; height: 0; border-top: 2px dashed var(--ink-3); background: none; border-radius: 0; }
.donut { display: grid; place-items: center; margin: 4px 0 18px; }
.donut svg { width: 184px; height: 184px; }
.dn-t { fill: var(--ink-3); font: 500 11px var(--f-body); letter-spacing: 0; }
.dn-v { fill: var(--ink); font: 700 19px var(--f-body); letter-spacing: -.02em; }
.rank { display: grid; gap: 10px; list-style: none; padding: 0; margin: 0; }
.rk { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 16px; grid-template-areas: "chip nm amt go" "chip bar pct go"; column-gap: 12px; row-gap: 7px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 11px 12px; border-radius: 18px; border: 1px solid var(--line-2); background: var(--surface); transition: background .15s, border-color .15s, transform .15s; }
.rk:hover { background: color-mix(in srgb, var(--c) 7%, var(--surface)); border-color: color-mix(in srgb, var(--c) 40%, var(--line-2)); }
.rk:active { transform: scale(.992); }
.rk .go { grid-area: go; color: var(--ink-3); display: grid; place-items: center; }
.rk .chip { grid-area: chip; width: 40px; height: 40px; }
.rk .nm { grid-area: nm; font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .nm small { color: var(--ink-3); font-weight: 600; margin-left: 4px; }
.rk .amt { grid-area: amt; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.rk .bar { grid-area: bar; height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.rk .bar > i { display: block; height: 100%; border-radius: 99px; transform-origin: left; animation: meter-in .9s var(--ease) .25s both; }
.rk .pct { grid-area: pct; font-weight: 600; font-size: 14px; text-align: right; min-width: 44px; }
.more { margin-top: 14px; width: 100%; }
.chip { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; color: var(--c, var(--ink-2)); background: color-mix(in srgb, var(--c, var(--ink-2)) 14%, var(--surface)); flex: none; }

/* ---------- tabel rekap ---------- */
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { font-size: 11.5px; letter-spacing: 0; color: var(--ink-3); text-align: right; padding: 10px 12px; font-weight: 600; white-space: nowrap; background: var(--sunken); }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 14px; }
.tbl td { padding: 10px 12px; border-top: 1px solid var(--line-2); text-align: right; font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.tbl td .tsub { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.tbl td:first-child { font-family: var(--f-body); font-weight: 600; font-size: 13px; white-space: normal; }
.tbl tr.now td { background: var(--brand-soft); border-top-color: transparent; }
.tbl tfoot td { font-weight: 700; border-top: 2px solid var(--line-2); background: var(--sunken); }

/* ---------- daftar transaksi ---------- */
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 16px 4px 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .01em; }
.day-h:first-child { padding-top: 0; }
.day-h span:last-child { font-family: var(--f-mono); font-weight: 600; font-size: 12px; }
.tx { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 13px; align-items: center; width: 100%; text-align: left; padding: 10px 8px; border-radius: 18px; transition: background .18s, transform .18s var(--ease); }
.tx:hover { background: var(--sunken); }
.tx:active { transform: scale(.985); }
.tx .t1 { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t2 { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tx .t2 em { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.tx .t2 .ic { flex: none; }
.tx > span:nth-child(2) { min-width: 0; display: grid; gap: 1px; }
.tx .chip { width: 42px; height: 42px; }
.tx .amt { font-family: var(--f-mono); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.tx .amt.in { color: var(--in); }
.tx .amt.out { color: var(--ink); }
.tools { display: grid; gap: 10px; margin-bottom: 14px; }
.search { position: relative; }
.search .ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search .input { padding-left: 44px; }
.tools-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tools-row select { width: auto; flex: 1 1 150px; }
.sumline { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink-2); margin-bottom: 12px; font-weight: 600; }
.sumline b { font-family: var(--f-mono); font-weight: 600; }

/* ---------- lembar catat ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(6, 22, 16, .46); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 60; display: flex; align-items: flex-end; justify-content: center; animation: fade .25s both; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 95dvh; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-2); animation: sheet-up .42s var(--ease) both; }
.sheet::before { content: ""; display: block; flex: none; width: 42px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 10px auto 0; }
@media (min-width: 720px) {
  .backdrop { align-items: center; padding: 24px; }
  .sheet { border-radius: 32px; max-height: min(92dvh, 880px); animation: pop .35s var(--ease) both; }
  .sheet::before { display: none; }
}
.sheet-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 8px; }
.sheet-h h2 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.sheet-b { overflow: auto; padding: 8px 20px 20px; display: grid; gap: 18px; align-content: start; }
.sheet-f { padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--surface); }
.tgl { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 18px; }
.tgl button { min-height: 48px; border-radius: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--ink-2); transition: background .25s var(--ease), color .25s, box-shadow .25s; }
.tgl button[aria-pressed="true"].out { background: var(--out); color: var(--on-solid); box-shadow: 0 10px 18px -10px var(--out); }

.remind { --rm: #EDA100; position: fixed; z-index: 80; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); border-radius: 26px; box-shadow: var(--shadow-2), inset 0 0 0 1px var(--ring); padding: 16px 48px 20px 20px; display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 14px; align-items: start; overflow: hidden; animation: rm-in .55s cubic-bezier(.2, .9, .3, 1.15) both; }

.rm-emo .e1 { display: inline-block; animation: rm-wob 1.3s ease-in-out .5s 2; }

.rm-x:hover { background: var(--sunken); color: var(--ink); }

@keyframes rm-in { from { opacity: 0; transform: translate(-50%, -26px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes rm-wob { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg) scale(1.08); } 75% { transform: rotate(14deg) scale(1.08); } }
@keyframes rm-t { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (max-width: 420px) { .remind { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding-left: 18px; } .rm-emo { width: 52px; height: 52px; font-size: 28px; border-radius: 17px; } }

.bud-amt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 13px; font-weight: 600; color: var(--hero-ink-2); margin-top: -4px; }

.budget .tile { --frame: var(--hero-frame); background: var(--hero-pill); }
.budget .tile .k, .budget .tile small { color: var(--hero-ink-2); }

.budget .tile.neg b { color: var(--hero-neg); }
.bud-callout { display: flex; gap: 10px; padding: 11px 13px; border-radius: 16px; border: 1px solid var(--hero-frame); background: var(--hero-panel); font-size: 12px; line-height: 1.55; color: var(--hero-ink-2); font-weight: 500; }

.avg-rows { display: grid; gap: 10px; }

/* ===== Submenu (Pengaturan) ===== */
.submenu { padding: 0; overflow: hidden; }

.sub-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 16px 20px; background: transparent; border: 0; cursor: pointer; font: inherit; color: inherit; }
.sub-h:hover { background: var(--sunken); }
.sub-tx { display: grid; gap: 2px; min-width: 0; }
.sub-name { font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
.sub-tx small { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.sub-chev { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line-2); color: var(--ink-2); }

.submenu.open .sub-chev svg { transform: rotate(0); }
.sub-body { padding: 4px 20px 20px; border-top: 1px solid var(--line-2); padding-top: 16px; }

/* ===== Isi kategori ===== */
.back-link { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px 6px 6px; margin: 0 0 8px -6px; border-radius: 99px; background: transparent; border: 0; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.back-link:hover { background: var(--sunken); }
.kat-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }

.kat-total { font-family: var(--f-mono); font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
.kat-top small { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
.rk .nm { white-space: normal; line-height: 1.25; overflow-wrap: anywhere; }

/* ===== Kalimat di dalam bingkai: rata kiri dan kanan (justify) ===== */
.bud-callout p, .bud-note, .tile small, .avg-note, .pot-note, .cat-hint, .cmp-sub, .bud-prev, .lead > span:not(.ic),
.card .desc, .banner > span, .empty-s, .empty p, .hint, .avg-rows .k small {
  text-align: justify; text-justify: inter-word; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.bud-callout p, .bud-note, .avg-note, .pot-note, .cat-hint, .cmp-sub, .bud-prev, .card .desc { text-align: justify; }

/* ---- Insight: rekap pengeluaran per kategori ---- */
.tbl-ins th { white-space: normal; line-height: 1.3; vertical-align: bottom; padding: 10px 8px; }
.tbl-ins td { padding: 10px 8px; }
.tbl-ins th:first-child, .tbl-ins td:first-child { width: 34px; padding-left: 12px; padding-right: 2px; text-align: left; color: var(--ink-3); }

.tbl-ins td:nth-child(2) { font-family: var(--f-body); white-space: normal; font-size: 13px; }

.tbl-ins td:nth-child(3), .tbl-ins td:nth-child(4) { font-variant-numeric: tabular-nums; }
.tbl-ins tfoot td:first-child { color: inherit; }
@media (max-width: 560px) {
  .card .tblwrap.ins-wrap { margin-inline: -14px; border-radius: 14px; }

}
.cat-lnk { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 2px 6px 2px 2px; margin: -2px 0; border-radius: 10px; background: transparent; border: 0; color: var(--ink); font-weight: 600; text-align: left; cursor: pointer; }
.cat-lnk:hover { background: var(--sunken); }
.cat-lnk .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }

.ins-custom { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.ins-custom label { flex: 1 1 150px; display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
@media (max-width: 520px) { .page-head .seg { width: 100%; } .page-head .seg button { flex: 1; padding: 0 6px; } }

/* ---------- cadangan data, pengingat akhir pekan, pantauan admin ---------- */
.remind.lv-bk { --rm: var(--brand); }
.rm-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.bk-last { margin: 10px 0 12px; font-size: 13.5px; color: var(--ink-2); }
.bk-last b { color: var(--ink); font-weight: 600; }
.bk-sep { height: 1px; background: var(--line); margin: 20px 0 16px; }
.bk-h { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
#bk-box { margin-top: 14px; display: grid; gap: 12px; }
#bk-box:empty { display: none; }
.bk-note { margin: 0; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; background: var(--sunken); color: var(--ink-2); text-align: justify; }
.bk-note.ok { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.bk-note.err { background: color-mix(in srgb, var(--out) 12%, var(--surface)); color: var(--out); font-weight: 600; }
.bk-prev { display: grid; gap: 12px; border-radius: 18px; background: var(--sunken); padding: 14px; box-shadow: inset 0 0 0 1px var(--ring); }
.bk-prev-h { display: flex; align-items: center; gap: 8px; min-width: 0; }

.bk-dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.bk-dl dt { font-size: 12px; font-weight: 500; color: var(--ink-3); }

.bk-warn { margin: 0; font-size: 13px; color: var(--ink-2); }

#bkc-form { max-width: 460px; }

.mon-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 4px; }
.mon-t { display: grid; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--ring); }
.mon-t .k { font-size: 12px; font-weight: 500; color: var(--ink-3); line-height: 1.35; }
.mon-t b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mon-t.warn b { color: var(--out); }
.mon-t.good b { color: var(--in); }
.mon-note { margin-top: 12px; font-size: 12.5px; line-height: 1.6; text-align: justify; }
.mon-d { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 10px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--sunken); }

@media (max-width: 520px) { .mon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bk-dl { grid-template-columns: minmax(0, 1fr); } }

/* ---------- cadangan tertutup seluruh akun (administrator) ---------- */
#vt-body { display: grid; gap: 0; }

.lang-sw button:hover { color: var(--ink); }
.lang-sw button[aria-pressed="true"] { background: var(--nav-on-bg); color: var(--nav-on-ink); border-color: transparent; }
#lc-card .seg { margin-top: 6px; }
#lc-card .field + .field { margin-top: 16px; }

/* ===== Kurs & indeks ===== */
.fx-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; margin-top: 14px; }
.fx-pair .field { margin: 0; min-width: 0; }

.fx-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 2px; }
.fx-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) auto; gap: 12px; align-items: center; padding: 12px 6px; border-radius: 14px; width: 100%; text-align: left; color: inherit; text-decoration: none; }
.fx-list li + li .fx-row { border-top: 1px solid var(--line); border-radius: 0; }
.fx-row .fx-c, .fx-row .fx-v { display: grid; gap: 2px; min-width: 0; }
.fx-row .fx-c small, .fx-row .fx-v small { color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.fx-row .fx-c b { font-size: 15px; }
.fx-row .fx-v b { font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fx-row .fx-t { display: grid; justify-items: end; gap: 3px; }
.fx-chg { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }
.spark { width: 84px; height: 28px; }
.spark polyline { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }

button.fx-pick:hover { background: var(--sunken); }
button.fx-pick.on { background: var(--brand-soft); }
.fx-links .fx-row { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 520px) {

  .fx-row .fx-v { justify-items: end; text-align: right; }

}

.ix-one { display: grid; gap: 12px; margin-top: 12px; }

.ix-chart .spark { width: 100%; height: 84px; }
.ix-chart .spark polyline { stroke-width: 2; }
.ix-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0; }
.ix-stats div { background: var(--sunken); border-radius: 14px; padding: 10px 12px; }
.ix-stats dt { color: var(--ink-3); font-size: 12px; }
.ix-stats dd { margin: 2px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Pemilih bahasa di layar utama (setelah masuk): bilah atas di ponsel, kaki sidebar di layar lebar */

.acc-n small, .ck-n small, .rk-n small { color: var(--ink-3); font-size: 12px; }

.rk-card.is-def { box-shadow: 0 0 0 2px var(--accent), var(--shadow-1); }
.rk-top { display: flex; align-items: center; gap: 12px; }

.def-b { font-style: normal; font-weight: 800; color: var(--ink); background: var(--accent-soft); padding: 0 6px; border-radius: 6px; }
.rk-hero .rk-hacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn-light { background: rgba(255, 255, 255, .92); color: #20243a; border-radius: 999px; font-weight: 700; }

.bank-pick { max-height: 260px; overflow: auto; display: grid; gap: 10px; padding: 4px 2px; margin-top: 8px; }

.bank-b { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 10px 6px 6px; border-radius: 14px; background: var(--sunken); text-align: left; font-weight: 600; font-size: 13px; min-width: 0; }
.bank-b span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ico-b { height: 46px; border-radius: 14px; background: var(--sunken); display: grid; place-items: center; color: var(--ink-2); }
.ico-b[aria-checked="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.ck-prev { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--sunken); }

.nav-sub { display: grid; gap: 2px; margin: 0 0 6px 22px; padding-left: 12px; border-left: 2px solid var(--line); }
.nav-s { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 12px; color: var(--ink-3); font-weight: 600; font-size: 13.5px; text-align: left; }
.nav-s:hover { background: var(--sunken); color: var(--ink); }

.nav-mk { color: var(--accent); font-weight: 800; }
.shell.side-min .nav-sub { display: none; }
.acc-note { color: var(--out); font-weight: 600; }
@media (max-width: 999px) { .tab { min-width: 0; padding-inline: 2px; } .tab span:last-child { font-size: 10.5px; } }
/* =====================================================================
   Kulit v2 — minimalis, modern, tetap ceria.
   Kertas biru-putih berbintik, kartu datar bergaris tipis, biru tua + biru cerah,
   tombol pil dengan bayangan "pop", angka besar tebal. Dimuat setelah base.css.
   ===================================================================== */
:root { --ease-pop: cubic-bezier(.3, 1.5, .5, 1); }
::selection { background: var(--accent); color: var(--accent-ink); }
body { letter-spacing: -.003em; padding-top: env(safe-area-inset-top, 0px); }

h1, .login-form h2, .sheet-h h2, .pwp h2 { font-family: var(--f-display); }
h1 { font-weight: 800; letter-spacing: -.04em; }
.hello { font-weight: 600; color: var(--ink-3); }

/* ---------- gerak: lebih singkat, lebih lincah ---------- */
#view.enter > * { animation-duration: .45s; }
#view.enter .dash > *, #view.enter .col > *, #view.enter .stack > * { animation-duration: .5s; animation-delay: .12s; }

#view.enter .dash > :nth-child(3), #view.enter .col > :nth-child(3), #view.enter .stack > :nth-child(3) { animation-delay: .22s; }
#view.enter .dash > :nth-child(n+4), #view.enter .col > :nth-child(n+4), #view.enter .stack > :nth-child(n+4) { animation-delay: .27s; }

/* ---------- merek ---------- */
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.035em; }
.logo .lg-bg { fill: var(--accent); stroke: var(--pop); stroke-width: 1.4; }
.logo .lg-ln { stroke: var(--accent-ink); }

/* ---------- tombol ---------- */
.btn { border-radius: 999px; font-weight: 700; letter-spacing: -.01em; padding: 0 22px; }
.btn-sm { border-radius: 999px; padding: 0 16px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--pop); box-shadow: 0 3px 0 var(--pop); }
.btn-primary:hover { filter: none; transform: translateY(-1px); box-shadow: 0 4px 0 var(--pop); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 0 0 var(--pop); }
.btn-ghost { border-color: var(--line-2); background: var(--surface); }
.btn-ghost:hover { background: var(--sunken); border-color: var(--ink-3); }
.btn-dark { background: var(--sunken); }
.btn-danger { border-color: color-mix(in srgb, var(--out) 55%, transparent); }
.icon-btn { border-radius: 50%; background: var(--surface); box-shadow: none; border: 1px solid var(--line-2); }
.icon-btn:hover { background: var(--sunken); border-color: var(--ink-3); }
.icon-btn:active { transform: scale(.9); }

/* ---------- isian ---------- */
.input { border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line-2); }
.input:hover { border-color: var(--ink-3); }
.input:focus, .input:focus-visible { background: var(--surface); border-color: var(--ink); box-shadow: 0 0 0 4px var(--accent-ring); }
.field > label, .lbl { font-weight: 600; }
.amt-wrap { border-radius: 20px; background: var(--surface); border: 1.5px solid var(--line-2); }
.amt-wrap:focus-within { background: var(--surface); border-color: var(--ink); box-shadow: 0 0 0 4px var(--accent-ring); }
.amt-wrap input { font-family: var(--f-display); font-weight: 800; letter-spacing: -.035em; }
.check input { accent-color: var(--ink); }
.pw .eye { border-radius: 50%; }
.banner, .netbar { border-radius: 18px; background: var(--accent-soft); }
.netbar.off { background: var(--danger-bg); }
.form-err { border-radius: 14px; }
.lead { background: var(--brand-soft); border-radius: 16px; }

/* ---------- kerangka ---------- */
.side { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; border: 1px solid var(--line); border-radius: 28px; }
.nav-i { border-radius: 999px; font-weight: 600; }
.nav-i[aria-current="page"] { box-shadow: none; }
.nav-i[aria-current="page"] .ic { color: var(--nav-on-icon); }
.avatar { border-radius: 50%; background: var(--accent-soft); font-weight: 700; }
.avatar.sm { background: var(--accent); color: var(--accent-ink); border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--pop); }
.profile .avatar { border-radius: 50%; }
.tabbar { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; border: 1px solid var(--line-2); border-radius: 999px; box-shadow: 0 14px 30px -16px rgba(21, 23, 26, .45); }
.tab { font-weight: 600; }
.tab .pill { width: 58px; }
.tab[aria-current="page"] .pill { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px var(--pop); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab:hover .pill { background: var(--sunken); }

/* tombol + melayang */
.fab { background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--pop); border-radius: 50%; box-shadow: 0 4px 0 var(--pop); transition: transform .25s var(--ease-pop), box-shadow .2s; }
.fab:hover { transform: translateY(-2px) rotate(8deg); box-shadow: 0 6px 0 var(--pop); }
.fab:active { transform: translateY(4px) rotate(90deg); box-shadow: 0 0 0 var(--pop); }
@media (min-width: 900px) { .fab { border-radius: 999px; } .fab:hover { transform: translateY(-2px); } .fab:active { transform: translateY(4px); } }
.fab-t { font-weight: 700; }

/* ---------- kontrol segmen ---------- */
.seg { background: var(--sunken); box-shadow: none; border: 1px solid var(--line); }
.seg button { font-weight: 600; }

.auth-tabs { border: 1px solid var(--line); }
.range .back { color: var(--ink); text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 4px; }

/* ---------- kartu ---------- */
.card { border-radius: 24px; padding: 20px; box-shadow: none; background: var(--surface); border: 1px solid var(--line); }
.card.submenu { padding: 0; }
.card-h h2, .card h2.t { font-weight: 700; letter-spacing: -.02em; }

.mon-t, .reg-d, .mon-d, .bk-prev, .done-box { box-shadow: none; border: 1px solid var(--line); background: var(--sunken); }
.badge { font-weight: 700; }
.badge.admin { background: var(--brand-soft); color: var(--brand); }
.badge.helper { background: var(--accent-soft); color: var(--ink); }
.badge.def { background: var(--accent-soft); }

.sub-chev, .fold-btn { border-radius: 50%; border-color: var(--line-2); }

/* ---------- hero saldo: kartu hitam pekat + confetti ---------- */
.hero { border-radius: 28px; padding: 24px; background: var(--hero-bg); box-shadow: none; border: 1px solid transparent; }
:root[data-theme="dark"] .hero { border-color: var(--line-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { border-color: var(--line-2); } }
.hero::before { width: 168px; height: 112px; right: 0; top: 0; border-radius: 0 28px 0 0; z-index: -1;
  background:
    radial-gradient(circle at 74% 28%, var(--hero-orb1) 0 30px, transparent 30.6px),
    radial-gradient(circle at 36% 62%, var(--hero-orb2) 0 7px, transparent 7.6px),
    radial-gradient(circle at 42% 14%, #fff 0 3.5px, transparent 4.1px),
    radial-gradient(circle at 92% 70%, transparent 0 9px, var(--hero-rp) 9.6px 11.4px, transparent 12px); }
.hero::after { display: none; }

.hero .big { font-family: var(--f-display); font-weight: 800; letter-spacing: -.055em; }

.hstat { backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 18px; background: var(--hero-pill); }
.hstat:hover { transform: none; }
.hstat .v { font-weight: 700; }
.hstat .k .ic { color: var(--hero-rp); }

.meter { background: var(--hero-track); height: 12px; }

.hero .meter.warn:not(.over) > i { background: var(--hero-warn); }
.hero .meter.danger > i, .hero .meter.over > i { background: var(--hero-danger); }
.budget { border-radius: 22px; }
.bud-name, .bud-amt b { font-weight: 800; }
.hero .btn-ghost { background: transparent; color: var(--hero-ink); border-color: var(--hero-frame); }
.hero .btn-ghost:hover { background: var(--hero-pill); border-color: var(--hero-ink-2); }
.hero .btn-primary { box-shadow: 0 3px 0 rgba(0, 0, 0, .5); border-color: rgba(255, 255, 255, .35); }
.hero .btn-dark { background: var(--hero-pill); color: var(--hero-ink); }
.hero .btn-dark:hover { background: var(--hero-frame); }
@media (max-width: 560px) { .hero { padding: 20px; border-radius: 26px; } .hero::before { width: 140px; height: 96px; border-top-right-radius: 26px; } }

/* ---------- daftar, peringkat, grafik ---------- */
.rk { border-radius: 18px; border: 1px solid var(--line); }
.rk .chip, .tx .chip { transition: transform .25s var(--ease-pop); }
.rk:hover .chip, .tx:hover .chip { transform: rotate(-8deg) scale(1.08); }
.rk:hover { background: var(--sunken); border-color: var(--line-2); }

.chip { border-radius: 14px; background: color-mix(in srgb, var(--c, var(--ink-2)) 17%, var(--surface)); }
.tx { border-radius: 18px; }
.tx .t1 { font-weight: 700; }
.tx .amt { font-weight: 700; }
.day-h { font-weight: 700; }
.tx .pend { background: var(--accent); color: var(--accent-ink); }
.tip { border-radius: 14px; }
.legend { font-weight: 600; }
.pot-rows > div, .potm { border-radius: 16px; }
.potm { border: 1px solid transparent; }
.potm:hover { transform: translateY(-2px) rotate(-.6deg); border-color: var(--c); }
.pot-bal, .kat-total, .mon-t b, .potm b, .dn-v { font-family: var(--f-display); font-weight: 800; letter-spacing: -.04em; }
.kat-top .chip { border-radius: 20px; }
.tbl th { background: var(--sunken); }
.tbl tr.now td { background: var(--accent-soft); }

/* ---------- lembar & isian catat ---------- */
.backdrop { background: rgba(21, 23, 26, .5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { border-radius: 30px 30px 0 0; box-shadow: var(--shadow-2); }

.cats { border-radius: 20px; background: var(--sunken); }
.cat { border: 1.5px solid var(--line-2); border-radius: 999px; background: var(--surface); box-shadow: none; padding: 0 14px 0 6px; }
.cat:hover { transform: translateY(-1px); border-color: var(--ink-3); }
.cat[aria-checked="true"] { border-color: var(--c); box-shadow: none; background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.cat .chip { border-radius: 50%; }
.thumb { border-radius: 20px; }
.buy { border-top-style: dashed; }

/* ---------- pengingat & pop-up ---------- */
.remind { border-radius: 24px; border: 1.5px solid var(--pop); box-shadow: 0 5px 0 var(--pop); }

.rm-body > b { font-weight: 800; letter-spacing: -.02em; }

.done-ic { border-radius: 50%; }

/* ---------- masuk & daftar: panel biru berani ---------- */
.login-brand { background: var(--login-bg); color: #fff; border: 1.5px solid var(--pop); border-radius: 34px; box-shadow: none; }
.login-brand::before { width: 300px; height: 300px; right: -110px; top: -120px; background: #5B8CFF; opacity: .6; animation-duration: 12s; }
.login-brand::after { width: 150px; height: 150px; left: -48px; bottom: -52px; background: #0B1B3F; opacity: 1; animation-duration: 14s; }
.login-brand .brand { color: #fff; }

.login-form-wrap > div { border-radius: 30px; border: 1.5px solid var(--pop); box-shadow: 0 6px 0 var(--pop); }
.login-form h2 { font-weight: 800; letter-spacing: -.04em; font-size: 28px; }
@media (max-width: 820px) {
  .login-brand { padding: 26px 24px 64px; border-radius: 30px; }
  .login-brand h1 { font-size: 2.2rem; }
  .login-form-wrap > div { border-radius: 26px; }
}

/* ---------- Saku: logo saku + koin, jahitan, dan intro S-A-K-U ---------- */

.logo .lg-pk { fill: #fff; }
.logo .lg-st { stroke: var(--accent); }
.login-brand .logo .lg-pk { fill: #2F62F0; }
.login-brand .logo .lg-st { stroke: #fff; }
.brand { gap: 10px; }
.brand span { font-weight: 800; letter-spacing: -.045em; font-size: 20px; }

/* kartu saldo: jahitan saku */
.hero::after { display: block; content: ""; position: absolute; inset: 9px; border: 1.5px dashed rgba(255, 255, 255, .17); border-radius: 21px; z-index: -1; pointer-events: none; width: auto; height: auto; left: 9px; bottom: 9px; background: none; }
@media (max-width: 560px) { .hero::after { inset: 8px; border-radius: 19px; } }

/* intro: ilustrasi saku + koin dan arti S-A-K-U */
.login-brand h1 { font-size: clamp(2.4rem, 5vw, 3.6rem); }
.saku-art { display: none; }
.saku-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.saku-grid li:nth-child(2) { animation-delay: .06s; } .saku-grid li:nth-child(3) { animation-delay: .12s; } .saku-grid li:nth-child(4) { animation-delay: .18s; }

@media (min-width: 821px) {

  .saku-art circle.in { fill: none; stroke: rgba(11, 27, 63, .28); stroke-width: 3; }
  .saku-art text { font-family: var(--f-display); font-weight: 800; font-size: 20px; fill: #0B1B3F; }

  .saku-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .saku-grid li { grid-template-columns: 38px minmax(0, 1fr); grid-template-areas: "b w" "b s"; justify-items: start; align-content: center; column-gap: 12px; row-gap: 1px; padding: 11px 14px; text-align: left; }
  .saku-grid b { grid-area: b; align-self: center; width: 38px; height: 38px; font-size: 21px; }

}
@media (max-width: 820px) { .login-brand h1 { font-size: 2.3rem; } .login-brand { gap: 16px; } }

/* ---------- Submenu halaman (Rekap, Tagihan, Rencana) ---------- */

/* ---------- Kartu anggaran di halaman Anggaran (latar hero, teks terang) ---------- */

.lnk { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--brand); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.due-sec .card-h h2 { font-size: 15px; }

.pbar { height: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.pbar > i { display: block; height: 100%; border-radius: 99px; background: var(--brand); transform-origin: left; animation: meter-in .9s var(--ease) both; }

.cic-n { display: grid; gap: 1px; min-width: 0; flex: 1; }
.cic-n b { font-size: 16px; font-weight: 800; color: var(--ink); overflow-wrap: anywhere; }
.cic-n small { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.cic-amt { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.cic-amt b { font-family: var(--f-mono); font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
.cic-amt span { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.cic-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cic-facts > div { display: grid; gap: 2px; min-width: 0; padding: 9px 10px; border-radius: 14px; background: var(--sunken); }
.cic-facts span { font-size: 11px; color: var(--ink-3); font-weight: 600; }
.cic-facts b { font-size: 12.5px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
@media (max-width: 420px) { .cic-facts { grid-template-columns: 1fr 1fr; } .cic-facts > div:last-child { grid-column: 1 / -1; } }
.cic-next { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.cic-next.late { color: var(--out); }
.cic-acts [aria-expanded="true"] svg { transform: rotate(180deg); }
.stp { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.stp.ok { background: color-mix(in srgb, var(--in) 14%, var(--surface)); color: var(--in); }
.stp.late { background: color-mix(in srgb, var(--out) 14%, var(--surface)); color: var(--out); }
.stp.today { background: var(--brand-soft); color: var(--brand); }
.stp.lalu { background: var(--sunken); color: var(--ink-3); }
.sched { margin-top: 2px; border: 1px solid var(--line-2); border-radius: 16px; }
.sched .tbl th, .sched .tbl td { padding: 9px 10px; }
.sched .tbl td { vertical-align: top; }
.sched .tbl td.stc { display: grid; justify-items: end; gap: 5px; }
.sched .tbl th:first-child, .sched .tbl td:first-child { text-align: left; }
.sched .tbl td:first-child { white-space: normal; font-family: var(--f-body); }
.sched .tbl td:first-child b { font-weight: 700; font-size: 12.5px; color: var(--ink); }
.sched .tbl th { white-space: normal; }
.sched tr.st-bayar td, .sched tr.st-lalu td { color: var(--ink-3); }
.pay-sum { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: var(--sunken); }
.pay-sum div { display: grid; gap: 1px; min-width: 0; }
.pay-sum b { font-size: 15px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.pay-sum small { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.mrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
.mrow .input { padding-inline: 10px; }
.field .hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
.btn-danger.armed { white-space: normal; }

.tiles-fill > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.due-sum .tile.neg b { color: var(--out); }

/* ---------- Logo SaKu: kata "Ku" berwarna hijau seperti pada logo ---------- */
.brand span b { font: inherit; color: var(--in); }
.login-brand .brand span b { color: #5EEAA5; }
.brand .logo { flex: none; width: auto; height: 36px; border-radius: 0; object-fit: contain; }
.login-brand .brand .logo { height: 30px; padding: 7px 8px; box-sizing: content-box; background: #fff; border-radius: 14px; }
.boot .logo { width: auto; height: 64px; border-radius: 0; }

/* ---------- Sidebar yang bisa diciutkan (desktop) ---------- */
.side-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.side-top .brand { min-width: 0; }
.side-toggle { flex: none; width: 34px; height: 34px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); transition: background .2s, color .2s, transform .18s var(--ease); }
.side-toggle:hover { color: var(--ink); background: var(--accent-soft); }
.side-toggle:active { transform: scale(.9); }
.side-toggle svg { transition: transform .3s var(--ease); }
@media (min-width: 900px) {
  .shell { transition: grid-template-columns .3s var(--ease); }
  .shell.side-min { grid-template-columns: 84px minmax(0, 1fr); }
  .shell.side-min .side { padding-inline: 10px; align-items: center; overflow: hidden; }
  .shell.side-min .side-top { flex-direction: column; align-items: center; gap: 12px; }
  .shell.side-min .side-top .brand { padding: 2px 0 0; }
  .shell.side-min .side-toggle svg { transform: rotate(180deg); }
  .shell.side-min .brand span, .shell.side-min .nav-t, .shell.side-min .me > div, .shell.side-min .side-foot .lbl { display: none; }
  .shell.side-min .side .nav, .shell.side-min .side-foot { width: 100%; justify-items: center; }
  .shell.side-min .nav-i { width: 48px; height: 48px; min-height: 48px; padding: 0; justify-content: center; position: relative; }
  .shell.side-min .nav-i .nbadge { position: absolute; top: 3px; right: 3px; margin: 0; }
  .shell.side-min .me { justify-content: center; }
  .shell.side-min .side-foot .btn { width: 48px; height: 48px; padding: 0; justify-content: center; }
}
@media (max-width: 899px) { .side-toggle { display: none; } }

/* ---------- Hutang ---------- */
.hut-fil { margin: 0 0 14px; max-width: 100%; overflow-x: auto; }
.hut-fil .seg { max-width: none; }
.hut-det { display: grid; gap: 10px; padding-top: 4px; border-top: 1px solid var(--line); }
.sec-s { margin: 12px 0 0; font-size: 13px; font-weight: 800; color: var(--ink-2); letter-spacing: .01em; }
.hut-pays { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hut-pays li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--sunken); font-size: 13px; }
.hut-pays li b { font-family: var(--f-mono); font-weight: 700; color: var(--ink); }

/* ---------- Target & Jajan Ramean ---------- */
.pbar.over i { background: var(--out); }
.amt-wrap.sm { padding: 2px 12px; border-radius: 14px; }
.amt-wrap.sm input { font-size: 16px; font-weight: 700; padding: 8px 0; letter-spacing: 0; }
.rf-split { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 16px; }
.rf-split[disabled] { opacity: .6; }
.rf-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 10px; }
.rf-chip-p { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 600; color: var(--ink); }
.rf-chip-p.me { background: var(--brand-soft); padding-right: 12px; }
.rf-chip-p button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
.rf-chip-p button:hover { background: var(--line); color: var(--ink); }
.rf-add { display: flex; gap: 8px; align-items: center; }
.rf-add .input { flex: 1; min-width: 0; }
.rf-item { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px; border-radius: 16px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); }
.rf-ir { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 132px) auto; gap: 8px; align-items: center; }
.rf-ir .icon-btn { width: 38px; height: 38px; }
@media (max-width: 420px) { .rf-ir { grid-template-columns: minmax(0, 1fr) auto; } .rf-ir .amt-wrap { grid-column: 1 / 2; } .rf-ir .icon-btn { grid-row: 1 / 3; grid-column: 2; align-self: center; } }
.rf-who { display: flex; flex-wrap: wrap; gap: 6px; }
.rf-who-b { min-height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); transition: background .2s, color .2s; }
.rf-who-b[aria-pressed="true"] { background: var(--nav-on-bg); color: var(--nav-on-ink); box-shadow: none; }
.rf-row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rf-row3 label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0 0 4px 2px; }
@media (max-width: 480px) { .rf-row3 { grid-template-columns: 1fr 1fr; } .rf-row3 > div:first-child { grid-column: 1 / -1; } }
.rf-res { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--brand-soft); }
.rf-rt { display: grid; gap: 4px; }
.rf-rl { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.rf-rl:first-child { font-size: 16px; color: var(--ink); font-weight: 800; }
.rf-rl b { font-family: var(--f-mono); font-weight: 700; }
.rf-bud { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.rf-bud.over { color: var(--out); }
.rm-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rm-p { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 9px 12px; border-radius: 14px; background: var(--sunken); }
.rf-res .rm-p { background: var(--surface); }
.rm-p.me { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--brand) 35%, transparent); }
.rm-av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--brand-soft); color: var(--ink); }
.rm-n { display: grid; min-width: 0; }
.rm-n b { font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }
.rm-n small { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.rm-s { font-family: var(--f-mono); font-weight: 700; font-size: 13.5px; color: var(--ink); }
.rm-t { grid-column: 2 / -1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.rm-left { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.rc-list { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.rc-list b { color: var(--ink); font-family: var(--f-mono); }

/* =====================================================================
   Kulit v3 — "SaKu hangat": krem hangat + indigo dalam + emas koin.
   Kartu sudut besar berbayang berlapis, hero gradasi dengan bentuk dekoratif,
   tab bar melayang, tombol emas "permen", kartu rekening ala kartu bank.
   ===================================================================== */
:root { --r-card: 26px; --r-in: 16px; --ease-pop: cubic-bezier(.3, 1.5, .5, 1); --gold-d: #C98F00; --gold-l: #FFDE7A; --card-sh: 0 1px 2px rgba(80, 50, 0, .05), 0 10px 28px -14px rgba(80, 50, 0, .26); }
:root[data-theme="dark"] { --gold-d: #B8820A; --card-sh: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 30px -14px rgba(0, 0, 0, .8); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gold-d: #B8820A; --card-sh: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 30px -14px rgba(0, 0, 0, .8); } }
body { background: var(--bg); }
body::before { background: var(--glow), radial-gradient(70vmax 38vmax at 105% -6%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%), radial-gradient(60vmax 34vmax at -10% 4%, color-mix(in srgb, var(--hero-orb1) 12%, transparent), transparent 70%); background-repeat: repeat, no-repeat, no-repeat; background-size: 22px 22px, auto, auto; -webkit-mask-image: linear-gradient(#000 0, rgba(0, 0, 0, 0) 90vh); mask-image: linear-gradient(#000 0, rgba(0, 0, 0, 0) 90vh); }
h1 { font-weight: 800; letter-spacing: -.04em; color: var(--ink); }
.hello { color: var(--ink-2); font-weight: 600; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- tombol: emas permen ---------- */
.btn { min-height: 44px; font-weight: 700; }
.btn-primary { background: linear-gradient(180deg, var(--gold-l), var(--accent) 55%); color: var(--accent-ink); border: 0; box-shadow: 0 3px 0 var(--gold-d), 0 12px 22px -10px rgba(255, 170, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .6); }
.btn-primary:hover { filter: saturate(1.08); transform: translateY(-1px); box-shadow: 0 4px 0 var(--gold-d), 0 16px 26px -10px rgba(255, 170, 0, .75), inset 0 1px 0 rgba(255, 255, 255, .6); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 0 0 var(--gold-d), inset 0 1px 0 rgba(255, 255, 255, .4); }
.btn-primary:disabled { opacity: .6; }
.btn-ghost { background: var(--surface); border: 1.5px solid var(--line-2); color: var(--ink); }
.btn-ghost:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn-dark { background: var(--brand-soft); color: var(--brand); }
.btn-danger { color: var(--out); }
.icon-btn { background: var(--surface); border: 1.5px solid var(--line-2); box-shadow: var(--shadow-1); }
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn-light { background: #fff; color: #2A1E00; }

/* ---------- isian ---------- */
.input { background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--r-in); }
.input:focus, .input:focus-visible, .amt-wrap:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--accent-ring); outline: none; }
.amt-wrap { border-radius: 22px; border: 1.5px solid var(--line-2); background: var(--surface); }
.amt-wrap input { color: var(--ink); }
.field > label, .lbl { color: var(--ink-2); font-weight: 700; }
.check input, .vt-modes input { accent-color: var(--brand); }
.banner, .netbar { background: var(--accent-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.lead { background: var(--brand-soft); color: var(--ink); }
.seg { background: var(--sunken); border: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: 0 6px 12px -6px rgba(31, 26, 61, .6); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); } }
.auth-tabs { border: 1px solid var(--line); }

/* ---------- merek ---------- */
.logo .lg-bg { fill: var(--brand); stroke: none; }
.brand span, .brand { color: var(--wordmark); }
.brand span b { color: var(--in); }
.avatar.sm { background: linear-gradient(145deg, var(--gold-l), var(--accent)); color: var(--accent-ink); box-shadow: 0 2px 0 var(--gold-d); border: 0; }
.avatar { background: var(--accent-soft); color: var(--ink); }

/* ---------- kerangka: sidebar & tab bar melayang ---------- */
.side { background: var(--glass); border: 1px solid var(--line); border-radius: 30px; box-shadow: var(--card-sh); }
.nav-i { border-radius: 16px; }
.nav-i:hover { background: var(--accent-soft); }
.nav-i[aria-current="page"] { background: linear-gradient(180deg, var(--gold-l), var(--accent)); box-shadow: 0 3px 0 var(--gold-d), 0 14px 24px -14px rgba(255, 170, 0, .8); }
.nav-i[aria-current="page"] .ic { color: var(--nav-on-icon); }
.tabbar { background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line-2); border-radius: 30px; box-shadow: 0 2px 4px rgba(40, 25, 90, .08), 0 22px 40px -16px rgba(40, 25, 90, .5); }
.tab { color: var(--ink-3); font-weight: 600; }
.tab .pill { width: 60px; height: 32px; transition: background .25s var(--ease), transform .25s var(--ease-pop); }
.tab:hover .pill { background: var(--accent-soft); }
.tab[aria-current="page"] { color: var(--ink); font-weight: 800; }
.tab[aria-current="page"] .pill { background: linear-gradient(180deg, var(--gold-l), var(--accent)); color: var(--nav-on-icon); box-shadow: 0 2px 0 var(--gold-d), 0 8px 14px -8px rgba(255, 170, 0, .9); transform: translateY(-2px); }
.tab[aria-current="page"]:hover .pill { background: linear-gradient(180deg, var(--gold-l), var(--accent)); }

    radial-gradient(circle at 190px 46px, #8FD3FF 0 26px, transparent 26.6px),
