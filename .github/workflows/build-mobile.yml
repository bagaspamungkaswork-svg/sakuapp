name: Bangun Aplikasi Mobile

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Buat proyek Android
        run: |
          npx cap add android
          bash scripts/patch-native.sh android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Bangun APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: saku-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (uji bangun simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Buat proyek iOS
        run: |
          npx cap add ios
          bash scripts/patch-native.sh ios
          npx capacitor-assets generate --ios
          npx cap sync ios
      - name: Bangun untuk simulator (tanpa tanda tangan)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET=(-workspace ios/App/App.xcworkspace); else TARGET=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app Saku-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: saku-ios-simulator
          path: Saku-simulator.zip
          if-no-files-found: error
