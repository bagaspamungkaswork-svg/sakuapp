name: Bangun Aplikasi Mobile

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Periksa berkas proyek
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html www/app.js assets/icon-only.png; do
            [ -f "$f" ] || { echo "::error::Berkas $f tidak ada di repositori. Unggah seluruh isi folder saku-mobile (termasuk folder www dan assets)."; exit 1; }
          done
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Buat proyek Android
        run: |
          npx --yes cap add android
          f=android/app/src/main/AndroidManifest.xml
          [ -f "$f" ] || { echo "::error::$f tidak terbentuk"; exit 1; }
          if ! grep -q 'android.permission.CAMERA' "$f"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" */>#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$f"
          fi
          grep -q 'android.permission.CAMERA' "$f" || { echo "::error::Gagal menambah izin kamera"; exit 1; }
          npx --yes capacitor-assets generate --android
          npx --yes cap sync android
      - name: Bangun APK
        working-directory: android
        run: |
          V=$(node -p "require('../package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$V\"/; s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          grep -n "versionName\|versionCode" app/build.gradle
          # Kunci tanda tangan tetap (secret) supaya update bisa dipasang di atas versi lama. Tanpa secret: kunci debug bawaan.
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            # nilai secret bisa terbawa spasi atau baris baru saat ditempel dari ponsel: bersihkan dulu
            printf '%s' "$KS_B64" | tr -d ' \n\r\t' | base64 -di > app/saku.keystore || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 tidak utuh. Hapus lalu tempel ulang seluruh nilai Secret 2 dari berkas kunci."; exit 1; }
            keytool -list -keystore app/saku.keystore -storetype PKCS12 -storepass "$KS_PASS" -alias saku > /dev/null 2>&1 || { echo "::error::Kunci tidak bisa dibuka. Periksa ANDROID_KEYSTORE_PASSWORD (Secret 1) dan ANDROID_KEYSTORE_BASE64 (Secret 2): salin nilainya utuh dari berkas kunci."; exit 1; }
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('saku.keystore')
                      storeType 'pkcs12'
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'saku'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
          }
          GRADLE
            echo "Tanda tangan: kunci tetap SaKu"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD belum diisi. APK memakai kunci debug sementara, jadi update tidak bisa dipasang di atas versi lama."
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Siapkan berkas rilis
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk saku.apk
          node -e "
            const fs = require('fs');
            let j = {}; try { j = JSON.parse(fs.readFileSync('www/version.json', 'utf8')); } catch (e) {}
            j.version = '$V'; j.build = ${{ github.run_number }};
            j.apk = 'https://github.com/${{ github.repository }}/releases/latest/download/saku.apk';
            fs.writeFileSync('version.json', JSON.stringify(j, null, 1) + '\n');
          "
          cat version.json
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$V-b${{ github.run_number }}"
          NOTES=$(node -e "try { const j = require('./version.json'); console.log((j.notes || []).map(n => '- ' + n).join('\n')); } catch (e) {}")
          gh release create "$TAG" saku.apk version.json --title "SaKu v$V (build ${{ github.run_number }})" --notes "${NOTES:-Pembaruan SaKu}" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: saku-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (uji bangun simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Periksa berkas proyek
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html www/app.js assets/icon-only.png; do
            [ -f "$f" ] || { echo "::error::Berkas $f tidak ada di repositori. Unggah seluruh isi folder saku-mobile (termasuk folder www dan assets)."; exit 1; }
          done
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Buat proyek iOS
        run: |
          npx --yes cap add ios
          p=ios/App/App/Info.plist
          [ -f "$p" ] || { echo "::error::$p tidak terbentuk"; exit 1; }
          pb=/usr/libexec/PlistBuddy
          set_key() { "$pb" -c "Delete :$1" "$p" >/dev/null 2>&1 || true; "$pb" -c "Add :$1 string $2" "$p"; }
          set_key NSCameraUsageDescription "Kamera dipakai untuk memotret struk belanja."
          set_key NSMicrophoneUsageDescription "Mikrofon dipakai untuk mencatat transaksi dengan suara."
          set_key NSSpeechRecognitionUsageDescription "Pengenalan suara dipakai untuk mengubah ucapan Anda menjadi catatan transaksi."
          set_key NSPhotoLibraryUsageDescription "Galeri dipakai untuk memilih foto struk."
          set_key NSPhotoLibraryAddUsageDescription "Menyimpan foto struk ke galeri."
          npx --yes capacitor-assets generate --ios
          npx --yes cap sync ios
      - name: Bangun untuk simulator (tanpa tanda tangan)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET=(-workspace ios/App/App.xcworkspace); else TARGET=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app Saku-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: saku-ios-simulator
          path: Saku-simulator.zip
          if-no-files-found: error
