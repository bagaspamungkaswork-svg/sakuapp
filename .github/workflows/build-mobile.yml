name: Bangun Aplikasi Mobile

on:
  workflow_dispatch:
    inputs:
      google_web_client_id:
        description: "Uji Google native dengan Web Client ID ini (kosongkan untuk memakai variabel repositori GOOGLE_WEB_CLIENT_ID)"
        required: false
        default: ""
  push:
    branches: [main, master]

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 40
    env:
      # Opsional: Web Client ID Google (dari Google Cloud / Firebase). Bila diisi, "Masuk dengan Google" native dipasang di APK dan
      # ID-nya ditanam ke www/firebase-config.js. Kosong = APK dibangun persis seperti sebelumnya.
      GOOGLE_WEB_CLIENT_ID: ${{ inputs.google_web_client_id || vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Periksa berkas proyek
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html www/app.js assets/icon-only.png; do
            [ -f "$f" ] || { echo "::error::Berkas $f tidak ada di repositori. Unggah seluruh isi folder saku-mobile (termasuk folder www dan assets)."; exit 1; }
          done
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Buat proyek Android
        run: |
          npx --yes cap add android
          f=android/app/src/main/AndroidManifest.xml
          [ -f "$f" ] || { echo "::error::$f tidak terbentuk"; exit 1; }
          if ! grep -q 'android.permission.CAMERA' "$f"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" */>#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$f"
          fi
          grep -q 'android.permission.CAMERA' "$f" || { echo "::error::Gagal menambah izin kamera"; exit 1; }
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            if printf '%s' "$GOOGLE_WEB_CLIENT_ID" | grep -qE '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'; then
              node -e "
                const fs = require('fs'), f = 'www/firebase-config.js', id = process.env.GOOGLE_WEB_CLIENT_ID;
                const w = {}; let cfg = null;
                try { new Function('window', fs.readFileSync(f, 'utf8'))(w); cfg = w.CATAT_FIREBASE; } catch (e) { console.log('::warning::firebase-config.js tidak terbaca: ' + e.message); }
                if (!cfg || typeof cfg !== 'object') { console.log('::warning::www/firebase-config.js tidak berisi konfigurasi Firebase; Google Client ID tidak ditanam'); process.exit(0); }
                cfg.googleClientId = id;
                fs.writeFileSync(f, 'window.CATAT_FIREBASE = ' + JSON.stringify(cfg) + ';\\n');
                console.log('Google Client ID ditanam ke www/firebase-config.js');
              "
              bash scripts/patch-google-native.sh android || echo "::warning::Google native gagal dipasang; aplikasi dibangun tanpa tombol Google native."
            else
              echo "::warning::GOOGLE_WEB_CLIENT_ID bentuknya tidak dikenali (harus berakhiran .apps.googleusercontent.com); diabaikan."
            fi
          fi
          npx --yes capacitor-assets generate --android
          npx --yes cap sync android
      - name: Bangun APK
        working-directory: android
        run: |
          V=$(node -p "require('../package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$V\"/; s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          grep -n "versionName\|versionCode" app/build.gradle
          # Kunci tanda tangan tetap supaya update bisa dipasang di atas versi lama. Kuncinya tersimpan terenkripsi (AES-256) di
          # signing/saku.keystore.enc; hanya kata sandinya yang menjadi secret (ANDROID_KEYSTORE_PASSWORD). Gagal dibuka: kunci debug sementara.
          SIGNED=0
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \n\r\t')
          # bila seluruh blok dari berkas kunci ikut tertempel, ambil hanya kata sandinya (32 karakter heksadesimal)
          KS_HEX=$(printf '%s' "$KS_PASS" | grep -oE '[0-9a-f]{32}' | head -1 || true); [ -n "$KS_HEX" ] && KS_PASS="$KS_HEX"; export KS_PASS
          if [ -n "$KS_PASS" ] && [ -f ../signing/saku.keystore.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../signing/saku.keystore.enc -out app/saku.keystore -pass env:KS_PASS 2>/dev/null && keytool -list -keystore app/saku.keystore -storetype PKCS12 -storepass "$KS_PASS" -alias saku > /dev/null 2>&1; then SIGNED=1; else rm -f app/saku.keystore; fi
          fi
          if [ "$SIGNED" = 1 ]; then
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('saku.keystore')
                      storeType 'pkcs12'
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'saku'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
          }
          GRADLE
            echo "Tanda tangan: kunci tetap SaKu"
          else
            if [ -z "$KS_PASS" ]; then WHY="secret ANDROID_KEYSTORE_PASSWORD kosong atau namanya berbeda"; elif [ ${#KS_PASS} -ne 32 ]; then WHY="secret ANDROID_KEYSTORE_PASSWORD berisi ${#KS_PASS} karakter, seharusnya 32 (nilai Secret 1)"; elif [ ! -f ../signing/saku.keystore.enc ]; then WHY="berkas signing/saku.keystore.enc tidak ada"; else WHY="isi secret ANDROID_KEYSTORE_PASSWORD tidak cocok dengan kuncinya (32 karakter tetapi bukan nilai Secret 1)"; fi
            echo "::warning::Kunci tetap tidak bisa dibuka: $WHY. APK memakai kunci debug sementara, jadi update tidak bisa dipasang di atas versi lama."
          fi
          chmod +x ./gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            main=$(find app/src/main/java -name MainActivity.java | head -1)
            if [ -d ../node_modules/@capgo/capacitor-social-login ]; then
              echo "::warning::Bangun dengan Google native gagal. Membangun ulang tanpa plugin Google supaya rilis tetap terbit."
              [ -f "$main.orig" ] && mv "$main.orig" "$main"
              (cd .. && npm uninstall @capgo/capacitor-social-login --no-audit --no-fund && npx --yes cap sync android)
              ./gradlew assembleDebug --no-daemon
            else
              exit 1
            fi
          fi
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Siapkan berkas rilis
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk saku.apk
          node -e "
            const fs = require('fs');
            let j = {}; try { j = JSON.parse(fs.readFileSync('www/version.json', 'utf8')); } catch (e) {}
            j.version = '$V'; j.build = ${{ github.run_number }};
            j.apk = 'https://github.com/${{ github.repository }}/releases/latest/download/saku.apk';
            fs.writeFileSync('version.json', JSON.stringify(j, null, 1) + '\n');
          "
          cat version.json
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Terbitkan rilis
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$V-b${{ github.run_number }}"
          NOTES=$(node -e "try { const j = require('./version.json'); console.log((j.notes || []).map(n => '- ' + n).join('\n')); } catch (e) {}")
          gh release create "$TAG" saku.apk version.json --title "SaKu v$V (build ${{ github.run_number }})" --notes "${NOTES:-Pembaruan SaKu}" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: saku-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (uji bangun simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Periksa berkas proyek
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html www/app.js assets/icon-only.png; do
            [ -f "$f" ] || { echo "::error::Berkas $f tidak ada di repositori. Unggah seluruh isi folder saku-mobile (termasuk folder www dan assets)."; exit 1; }
          done
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Buat proyek iOS
        run: |
          npx --yes cap add ios
          p=ios/App/App/Info.plist
          [ -f "$p" ] || { echo "::error::$p tidak terbentuk"; exit 1; }
          pb=/usr/libexec/PlistBuddy
          set_key() { "$pb" -c "Delete :$1" "$p" >/dev/null 2>&1 || true; "$pb" -c "Add :$1 string $2" "$p"; }
          set_key NSCameraUsageDescription "Kamera dipakai untuk memotret struk belanja."
          set_key NSMicrophoneUsageDescription "Mikrofon dipakai untuk mencatat transaksi dengan suara."
          set_key NSSpeechRecognitionUsageDescription "Pengenalan suara dipakai untuk mengubah ucapan Anda menjadi catatan transaksi."
          set_key NSPhotoLibraryUsageDescription "Galeri dipakai untuk memilih foto struk."
          set_key NSPhotoLibraryAddUsageDescription "Menyimpan foto struk ke galeri."
          npx --yes capacitor-assets generate --ios
          npx --yes cap sync ios
      - name: Bangun untuk simulator (tanpa tanda tangan)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET=(-workspace ios/App/App.xcworkspace); else TARGET=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app Saku-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: saku-ios-simulator
          path: Saku-simulator.zip
          if-no-files-found: error
