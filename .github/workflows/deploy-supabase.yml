name: Deploy Supabase

# Otomatis deploy Edge Function "api" (dan migrasi database) ke Supabase
# setiap ada perubahan di folder supabase/ pada branch utama. Bisa juga dijalankan manual.
on:
  push:
    branches: [main, master]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Periksa rahasia
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ] || { echo "::error::Isi secret SUPABASE_ACCESS_TOKEN dan SUPABASE_PROJECT_REF di Settings > Secrets and variables > Actions"; exit 1; }
      - name: Rapikan kode proyek
        run: |
          REF=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\..*$##; s#/.*$##' | tr 'A-Z' 'a-z')
          echo "$REF" | grep -Eq '^[a-z]{20}$' || { echo "::error::SUPABASE_PROJECT_REF harus 20 huruf kecil (bagian depan https://xxxx.supabase.co), bukan URL penuh, kata sandi, atau token."; exit 1; }
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function api
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Migrasi database (opsional)
        if: env.SUPABASE_DB_PASSWORD != ''
        continue-on-error: true
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --include-all --yes
      - name: Aktifkan Bot Telegram (opsional)
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          supabase secrets set TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" --project-ref "$PROJECT_REF"
          SEC=$(printf 'saku-webhook' | openssl dgst -sha256 -hmac "$TELEGRAM_BOT_TOKEN" -hex | sed 's/^.* //')
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/api?tg=1" \
            --data-urlencode "secret_token=${SEC}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            --data-urlencode "drop_pending_updates=true" >/dev/null && echo "Webhook Telegram terdaftar"
